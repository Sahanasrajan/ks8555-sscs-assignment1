[project]
name = "ks8555-sscs-assignment1"
version = "0.1.0"
description = "This file helps in sorting out pyproject.toml configuration"
authors = [
    {name = "Kanthimathi",email = "121882160+Sahanasrajan@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "cryptography (>=50.0.2,<51.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "types-requests (>=2.33.0.20261006,<3.0.0.0)"
]
[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88

[tool.mypy]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "part2-outputs"]